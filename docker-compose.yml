
services:
  postgres:
    image: postgres:15-alpine
    container_name: clinicflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: clinicflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./clinicflow-backend
    container_name: clinicflow_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_NAME=clinicflow
      - JWT_SECRET=your_super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./clinicflow-frontend
    container_name: clinicflow_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres_data: